name: Release Android APK

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.2.0-rc.1 for Beta, or v1.2.0 for Production). Leave blank to use package.json.'
        required: false
        default: ''
      publish_immediately:
        description: 'Publish stable release immediately (false = create Draft so you can verify Desktop + Android first)'
        type: boolean
        required: false
        default: false

jobs:
  android-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine Release Tag & Channel
        id: release_info
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
            if [[ ! $TAG =~ ^v ]]; then TAG="v$TAG"; fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG="v$PKG_VER"
          fi

          VERSION="${TAG#v}"

          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            IS_PRERELEASE="true"
            IS_DRAFT="false"
            CHANNEL="beta"
          else
            IS_PRERELEASE="false"
            if [ "${{ github.event.inputs.publish_immediately }}" = "true" ]; then
              IS_DRAFT="false"
            else
              IS_DRAFT="true"
            fi
            CHANNEL="production"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "is_draft=$IS_DRAFT" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "Target tag=$TAG | version=$VERSION | channel=$CHANNEL | prerelease=$IS_PRERELEASE | draft=$IS_DRAFT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build and Sign APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../release
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            export KEYSTORE_FILE="release.keystore"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../release/app-release.apk
          else
            echo "No keystore secret provided, building debug APK..."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../release/app-release.apk
          fi

      - name: Generate release manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        run: node scripts/generate-release-manifest.mjs

      - name: Upload Android release assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Payroll Pro ${{ steps.release_info.outputs.tag }}${{ steps.release_info.outputs.is_prerelease == 'true' && ' (Beta / Test)' || '' }}"
          draft: ${{ steps.release_info.outputs.is_draft == 'true' }}
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          files: |
            release/app-release.apk
            release/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
