name: Build iOS (.ipa)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Optional version override (e.g. 1.1.4). Leave blank to use package.json.'
        required: false
        default: ''

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build unsigned iOS app
        working-directory: ios/App
        run: |
          VERSION="${{ github.event.inputs.marketing_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('../../package.json').version")
          fi

          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package unsigned .ipa
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -r -y ../../PayrollPro-unsigned.ipa Payload

      - name: Upload iOS .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayrollPro-unsigned-ipa
          path: PayrollPro-unsigned.ipa
          retention-days: 14
